[env]
platform = ststm32
board = blackpill_f411ce
framework = cmsis
upload_protocol = serial
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_src_filter = +<extra/>

; [env:foldername]
; build_src_filter = ${env.build_src_filter} +<foldername/>

[env:1_polling]
build_src_filter = +<1_polling/>

[env:2_interrupt]
build_src_filter = +<2_interrupt/>